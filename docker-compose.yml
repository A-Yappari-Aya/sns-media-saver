services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      WORKER_URL: http://worker:4100
      NEXT_PUBLIC_SITE_NAME: "メディア保存"
      NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
      NEXT_PUBLIC_ADSENSE_SLOT_TOP: ${NEXT_PUBLIC_ADSENSE_SLOT_TOP:-}
      NEXT_PUBLIC_ADSENSE_SLOT_RESULT: ${NEXT_PUBLIC_ADSENSE_SLOT_RESULT:-}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_SEC: ${RATE_LIMIT_WINDOW_SEC:-60}
      RESOLVE_TIMEOUT_MS: ${RESOLVE_TIMEOUT_MS:-45000}
    depends_on:
      - worker
    restart: unless-stopped
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    environment:
      PORT: "4100"
      YT_DLP_PATH: yt-dlp
      WORKER_TIMEOUT_MS: ${WORKER_TIMEOUT_MS:-40000}
      MAX_FILESIZE: ${MAX_FILESIZE:-100M}
    restart: unless-stopped
